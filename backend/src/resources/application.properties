spring.datasource.url=jdbc:mariadb://localhost:3306/letterbooks
spring.datasource.username=letter_user
spring.datasource.password=admin123
spring.jpa.hibernate.ddl-auto=validate
# Obliga a Hibernate a usar los nombres exactos de las anotaciones @Table y @Column
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
# Configuración para guardar las imagenes que sube el usuario cuando actualiza su perfil
app.upload.dir=almacenamiento/usuarios
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# Configuración para correr las pruebas con la BD
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false